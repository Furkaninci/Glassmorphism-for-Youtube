<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glassmorphism Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="glass-panel">
    <header class="glass-header">
      <span class="glass-title">Glassmorphism Effect</span>
      <label class="switch">
        <input type="checkbox" id="glassEnabled" />
        <span class="slider-toggle"></span>
      </label>
    </header>

    <div class="glass-body">
      <div class="control-group">
        <div class="control-label">
          <span>Blur Slider</span>
          <span class="value-badge" id="blurValue">16px</span>
        </div>
        <input type="range" id="blurIntensity" min="0" max="50" step="1" />
      </div>

      <div class="control-group row">
        <span>Left Menu Color</span>
        <input type="color" id="menuBgColor" class="color-input" />
      </div>

      <p class="status-text" id="statusText"></p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
